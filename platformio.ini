; NavPlotter Segnalatore: a beacon for buoys and other objects, on a Heltec WiFi LoRa 32 V3 (ESP32-S3 + SX1262,
; 868 MHz) with an external GPS module.

[env:heltec_wifi_lora_32_V3]
platform = espressif32@6.5.0
board = heltec_wifi_lora_32_V3
framework = arduino
upload_speed = 921600
monitor_speed = 115200
board_build.filesystem = littlefs
; Turns web/index.html into src/web_page.h before every build
extra_scripts = pre:tools/embed_web.py
lib_deps =
	jgromes/RadioLib@^6.6.0
	olikraus/U8g2@^2.35.19
	mikalhart/TinyGPSPlus@^1.0.3
